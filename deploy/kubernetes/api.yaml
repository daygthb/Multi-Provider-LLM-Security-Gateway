apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: llm-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: llm-gateway:0.1.0
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: GATEWAY_REDIS_URL
              valueFrom:
                secretKeyRef: {name: gateway-secrets, key: redis-url}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: gateway-secrets, key: openai-api-key, optional: true}
            - {name: GATEWAY_POLICY_FILE, value: /app/config/policy.yaml}
            - {name: GATEWAY_PROVIDERS_FILE, value: /app/config/providers.yaml}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe: {httpGet: {path: /health/live, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15, timeoutSeconds: 3}
      volumes:
        - {name: config, configMap: {name: gateway-config}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: llm-gateway}
spec:
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: http, name: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gateway, namespace: llm-gateway}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gateway, namespace: llm-gateway}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: gateway}
