apiVersion: v1
kind: ConfigMap
metadata: {name: gateway-config, namespace: llm-gateway}
data:
  providers.yaml: |
    providers:
      - name: mock-primary
        kind: mock
        base_url: http://mock-provider:8001
        models: {mock-model: mock-model}
        priority: 0
      - name: mock-fallback
        kind: mock
        base_url: http://mock-provider:8001
        models: {mock-model: mock-model}
        priority: 1
  policy.yaml: |
    rules:
      - id: prompt_injection
        direction: request
        pattern: '(ignore|disregard|override)\s+(all\s+)?(previous|prior|system)\s+(instructions|rules|prompts)'
        score: 80
        action: block
      - id: jailbreak
        direction: request
        pattern: '\b(DAN mode|do anything now|developer mode|jailbreak)\b'
        score: 80
        action: block
      - id: prompt_extraction
        direction: request
        pattern: '(reveal|print|show|repeat|extract)\b.{0,40}\b(system prompt|system instructions|hidden instructions)'
        score: 80
        action: block
      - id: role_manipulation
        direction: request
        pattern: '(\[INST\]|<<SYS>>|<\|system\|>|<\|im_start\|>system|\brole\s*[:=]\s*["\x27]?system)'
        score: 80
        action: block
      - id: encoded_payload
        direction: request
        pattern: '\b(base64|hex)\s*:\s*[A-Za-z0-9+/=]{24,}'
        score: 65
        action: block
      - id: suspicious_safety
        direction: request
        pattern: 'hypothetically bypass safety'
        score: 30
        action: warn
      - id: ssn
        direction: request
        pattern: '\b\d{3}-\d{2}-\d{4}\b'
        score: 20
        action: redact
      - id: credit_card
        direction: request
        pattern: '\b(?:\d[ -]?){13,19}\b'
        score: 20
        action: redact
      - id: email
        direction: request
        pattern: '\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
        score: 10
        action: redact
      - id: phone
        direction: request
        pattern: '(?<!\w)(?:\+\d{1,3}[ .-]?)?(?:\(\d{3}\)|\d{3})[ .-]\d{3}[ .-]\d{4}\b'
        score: 10
        action: redact
      - id: private_key
        direction: response
        pattern: '(?s)-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----.*?(?:-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|$)'
        score: 100
        action: block
      - id: access_token
        direction: response
        pattern: '(\bsk-[A-Za-z0-9_-]{20,}|\bAKIA[A-Z0-9]{16}\b|\bgh[pousr]_[A-Za-z0-9]{20,}|\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)'
        score: 100
        action: block
      - id: secret_assignment
        direction: response
        pattern: '\b(api[_ -]?key|password|access[_ -]?token|secret)\s*[:=]\s*[^\s,;]{8,}'
        score: 90
        action: block
      - id: blocked_phrase
        direction: response
        pattern: 'internal confidential phrase'
        score: 80
        action: block
      - id: gateway_key
        direction: response
        pattern: '\bgw_[A-Za-z0-9_-]{43,}(?![A-Za-z0-9_-])'
        score: 100
        action: block
